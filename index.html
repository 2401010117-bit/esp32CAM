<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#04080e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Pantau Kamera</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body class="offline">

  <main class="stage" id="stage">
    <canvas id="camCanvas" class="view" width="640" height="480"></canvas>
    <img id="camImg" class="view" alt="Siaran langsung kamera" draggable="false" hidden>
    <div class="offline-card">
      <p class="offline-title" id="offlineTitle">Mencari kamera…</p>
      <p class="offline-hint" id="offlineHint">Ketik alamat IP kamera lalu tekan Hubungkan.</p>
      <form class="ip-form" id="ipForm" autocomplete="off">
        <input class="ip-input" id="ipInput" type="text" inputmode="decimal" placeholder="Contoh: 192.168.1.20"
               aria-label="Alamat IP kamera" autocapitalize="off" autocorrect="off" spellcheck="false">
        <button class="ip-btn" type="submit">Hubungkan</button>
      </form>
    </div>
  </main>

  <div class="chip" id="chip" data-state="connecting">
    <span class="dot"></span><span id="chipText">Menghubungkan…</span><span class="chip-sub" id="chipSub"></span>
  </div>

  <div class="dock" id="dock">
    <button class="tab" id="btnTab" type="button" aria-label="Tampilkan atau sembunyikan kontrol" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>
    </button>
    <div class="bar">
      <button class="flash" id="btnFlash" type="button" aria-pressed="false" aria-label="Lampu flash" title="Flash">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12.5L13 2z"/></svg>
      </button>
      <button class="tool" id="btnRotate" type="button" aria-label="Putar gambar 90 derajat" title="Putar 90°">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>
      </button>
      <button class="tool" id="btnFit" type="button" aria-label="Ganti ukuran video: utuh atau isi layar" title="Utuh / isi layar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
      <button class="tool" id="btnSettings" type="button" aria-label="Buka pengaturan" title="Pengaturan">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      </button>
      <span class="sep" aria-hidden="true"></span>
      <div class="res" role="radiogroup" aria-label="Resolusi video">
        <button class="res-btn" type="button" role="radio" data-res="1" title="160x120">QQVGA</button>
        <button class="res-btn" type="button" role="radio" data-res="5" title="320x240">QVGA</button>
        <button class="res-btn" type="button" role="radio" data-res="8" title="640x480">VGA</button>
        <button class="res-btn" type="button" role="radio" data-res="9" title="800x600">SVGA</button>
        <button class="res-btn" type="button" role="radio" data-res="10" title="1024x768">XGA</button>
        <button class="res-btn" type="button" role="radio" data-res="11" title="1280x720 (16:9)">HD</button>
        <button class="res-btn" type="button" role="radio" data-res="13" title="1600x1200">UXGA</button>
      </div>
    </div>
  </div>

  <div class="backdrop" id="backdrop"></div>
  <aside class="sheet" id="sheet" aria-hidden="true" aria-label="Pengaturan">
    <div class="sheet-head">
      <div class="titles">
        <h2>Pengaturan</h2>
        <p class="sub" id="hostText"></p>
      </div>
      <form class="ip-form ip-inline" id="ipFormSheet" autocomplete="off">
        <input class="ip-input" id="ipInputSheet" type="text" inputmode="decimal" placeholder="Alamat IP kamera"
               aria-label="Alamat IP kamera" autocapitalize="off" autocorrect="off" spellcheck="false">
        <button class="ip-btn" type="submit">Sambung</button>
      </form>
      <button class="close" id="btnClose" type="button" aria-label="Tutup pengaturan">&times;</button>
    </div>

    <div class="grid">
      <label class="cell select" for="framesize">
        <span class="name">Resolusi</span>
        <select id="framesize" data-sensor="framesize">
          <option value="14">FHD 1920x1080 (16:9)</option>
          <option value="13">UXGA 1600x1200</option>
          <option value="12">SXGA 1280x1024</option>
          <option value="11">HD 1280x720 (16:9)</option>
          <option value="10">XGA 1024x768</option>
          <option value="9">SVGA 800x600</option>
          <option value="8">VGA 640x480</option>
          <option value="7">HVGA 480x320</option>
          <option value="6">CIF 400x296</option>
          <option value="5">QVGA 320x240</option>
          <option value="4">240x240</option>
          <option value="3">HQVGA 240x176</option>
          <option value="2">QCIF 176x144</option>
          <option value="1">QQVGA 160x120</option>
          <option value="0">96x96</option>
        </select>
      </label>
      <label class="cell select" for="rot">
        <span class="name">Putaran gambar</span>
        <select id="rot">
          <option value="0">0&deg; (asli)</option>
          <option value="90">90&deg; ke kanan</option>
          <option value="180">180&deg;</option>
          <option value="270">270&deg; (ke kiri)</option>
        </select>
      </label>
      <label class="cell range" for="zoom">
        <span class="name">Ukuran video</span><output id="zoomOut"></output>
        <input id="zoom" type="range" min="0" max="100" step="5">
      </label>
      <label class="cell range" for="quality">
        <span class="name">Kehalusan (kecil = halus)</span><output></output>
        <input id="quality" type="range" min="4" max="63" step="1" data-sensor="quality">
      </label>
      <label class="cell switch" for="autoq">
        <span class="name">Kehalusan otomatis</span>
        <input id="autoq" type="checkbox">
      </label>
      <label class="cell range" for="brightness">
        <span class="name">Kecerahan</span><output></output>
        <input id="brightness" type="range" min="-2" max="2" step="1" data-sensor="brightness">
      </label>
      <label class="cell range" for="contrast">
        <span class="name">Kontras</span><output></output>
        <input id="contrast" type="range" min="-2" max="2" step="1" data-sensor="contrast">
      </label>
      <label class="cell range" for="saturation">
        <span class="name">Saturasi warna</span><output></output>
        <input id="saturation" type="range" min="-2" max="2" step="1" data-sensor="saturation">
      </label>
      <label class="cell switch" for="vflip">
        <span class="name">Balik atas-bawah</span>
        <input id="vflip" type="checkbox" data-sensor="vflip">
      </label>
      <label class="cell switch" for="hmirror">
        <span class="name">Balik kiri-kanan</span>
        <input id="hmirror" type="checkbox" data-sensor="hmirror">
      </label>
      <label class="cell switch" for="wake">
        <span class="name">Layar tetap menyala</span>
        <input id="wake" type="checkbox">
      </label>
      <button class="cell btn-cell" id="btnReload" type="button">Muat ulang video</button>
      <button class="cell btn-cell ghost" id="btnReset" type="button">Kembalikan bawaan</button>
    </div>
  </aside>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
